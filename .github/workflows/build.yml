name: Build 7Hills Link

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install grpcio protobuf pytest pillow
      - run: python -m pytest -q tests
        env:
          PYTHONPATH: src

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name 7HillsLink
          --paths src
          --add-data "src/sevenhills_link/ui;sevenhills_link/ui"
          --add-data "src/sevenhills_link/data;sevenhills_link/data"
          --collect-submodules sevenhills_link
          --hidden-import keyring.backends.Windows
          --hidden-import pystray._win32
          --hidden-import win32com.client
          --collect-submodules winrt
          --hidden-import mss.windows
          run_client.py
      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\dist\7HillsLink.exe --version | Out-String
          Write-Host "version: $v"
      # The screen reading (screen.py) can only be tried on Windows, so the build does it: the exe
      # just made reads a drawn stand-in for a game screenshot with Windows' own text
      # recognition, in the client's own way and in every other way the corner could be
      # prepared (the log shows how each went), and then looks at this runner's screen.
      # A missing OCR language on the runner is a warning; anything else that goes wrong
      # stops the build.
      - name: Windows OCR language
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*" | Format-Table Name, State
          $cap = Get-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0" }
      - name: Screen reading test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ocrtest'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $json = "$env:LOCALAPPDATA\7HillsLink\screen-test.json"
          # The exe is a window program: its answer is read from screen-test.json, not from a pipe.
          function Invoke-ScreenTest($arguments) {
            Remove-Item $json -ErrorAction SilentlyContinue
            $p = Start-Process dist/7HillsLink.exe -ArgumentList $arguments -PassThru
            $null = $p.Handle
            $p | Wait-Process -Timeout 180 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { $p | Stop-Process -Force; throw 'the screen test did not finish in three minutes' }
            $text = Get-Content $json -Raw -ErrorAction SilentlyContinue
            Write-Host "exit code $($p.ExitCode)"
            if (-not $text) { throw 'the exe wrote no screen-test.json' }
            $r = $text | ConvertFrom-Json
            # The answer (what the client settles on), the lines it read, then every way of reading, one line each.
            $r | Select-Object ok, error, source, language, lines_from, box, scale, prepared, size, ms, lines, block, location, place, confidence, position, position_ways, other_lines | ConvertTo-Json -Compress -Depth 4 | Write-Host
            $r.read | ForEach-Object { Write-Host "   | $_" }
            $r.tried | ForEach-Object { Write-Host ('   {0,-6} x{1} {2,-9} {3,5} ms  {4,2} lines  location [{5}]  place [{6}]  position [{9}]  zones [{7}] {8}' -f $_.box, $_.scale, $_.prepared, $_.ms, $_.lines, $_.location, $_.place, ($_.zones -join ', '), $_.error, $(if ($_.position) { "$($_.position.lat) $($_.position.lon) $($_.position.alt)" } else { '' })) }
            return [pscustomobject]@{ Code = $p.ExitCode; Result = $r }
          }
          # The same block at the two commonest screen sizes: both must come back as Grim HEX at Yela, read
          # with the lines put together from the words, and with the position on it.
          foreach ($size in @(@(2560, 1440), @(1920, 1080))) {
            $shot = Join-Path $env:RUNNER_TEMP "shot-$($size[1]).png"
            python tools/make_debug_screenshot.py $shot $size[0] $size[1]
            $t = Invoke-ScreenTest @('--screen-test', "`"$shot`"")
            if ($t.Code -eq 3 -and $t.Result.error -match 'no OCR language installed') {
              Write-Host "::warning::Windows has no OCR language on this runner: the screen reading in the exe was NOT tried"
              exit 0
            }
            if ($t.Code -ne 0 -or -not $t.Result.ok) { Write-Error "the screen test failed (exit code $($t.Code)): $($t.Result.error)"; exit 1 }
            if ($t.Result.lines_from -ne 'words') { Write-Error "the lines were not put together from the words: $($t.Result.lines_from)"; exit 1 }
            if (-not $t.Result.block) { Write-Error "$($size[1])p: the debug block was not found in the picture"; exit 1 }
            # Grim HEX is on the place list since 0.8.1: the location line names it, inside the zone of Yela.
            if ($t.Result.place -ne 'stanton/crusader/yela/grim-hex') { Write-Error "$($size[1])p: the debug text was read as '$($t.Result.place)', not Grim HEX at Yela"; exit 1 }
            if ($t.Result.confidence -ne 'exact') { Write-Error "$($size[1])p: a station from the screen must be 'exact', got '$($t.Result.confidence)'"; exit 1 }
                        # The exact position (position.py): the picture describes 20 S, 148 W on Yela, 502 m above
            # the radius (tools/make_debug_screenshot.py). The numbers must be read back right.
            $pos = $t.Result.position
            if (-not $pos) { Write-Error "$($size[1])p: no position was read from the debug text (ways that gave one: $($t.Result.position_ways))"; exit 1 }
            if ($pos.body -ne 'stanton/crusader/yela' -or [math]::Abs($pos.lat + 20) -gt 0.02 -or [math]::Abs($pos.lon + 148) -gt 0.02 -or [math]::Abs($pos.alt - 502) -gt 20) {
              Write-Error "$($size[1])p: the position was read as $($pos.body) $($pos.lat) $($pos.lon) $($pos.alt) m, not Yela -20 -148 502 m"; exit 1
            }
          }
          # Pyro: the zone there is the short name "pyro6", which the reader takes for "pyr06" on a real
          # screen. Either reading must come back as Terminus with the position on it.
          $shot = Join-Path $env:RUNNER_TEMP "shot-pyro.png"
          python tools/make_debug_screenshot.py $shot 2560 1440 pyro
          $t = Invoke-ScreenTest @('--screen-test', "`"$shot`"")
          if ($t.Code -ne 0 -or -not $t.Result.ok) { Write-Error "the Pyro screen test failed (exit code $($t.Code)): $($t.Result.error)"; exit 1 }
          Write-Host "Pyro: zones [$($t.Result.zones -join ', ')] place [$($t.Result.place)]"
          if ($t.Result.place -ne 'pyro/terminus') { Write-Error "Pyro: the debug text was read as '$($t.Result.place)', not Terminus (zones: $($t.Result.zones -join ', '))"; exit 1 }
          $pos = $t.Result.position
          if (-not $pos -or $pos.body -ne 'pyro/terminus' -or [math]::Abs($pos.lat + 20) -gt 0.02 -or [math]::Abs($pos.lon + 148) -gt 0.02) {
            Write-Error "Pyro: the position was read as $($pos.body) $($pos.lat) $($pos.lon), not Terminus -20 -148"; exit 1
          }
          # The live path: capture this screen's corner with mss and read it. There is no game on
          # the runner, so no place is expected; a runner without a screen to capture is a warning.
          try { $live = Invoke-ScreenTest @('--screen-test') } catch { $live = [pscustomobject]@{ Code = -1; Result = [pscustomobject]@{ error = "$_" } } }
          if ($live.Result.error -match 'ModuleNotFoundError|ImportError') { Write-Error "a module is missing from the exe: $($live.Result.error)"; exit 1 }
          if ($live.Code -ne 0 -or -not $live.Result.captured) {
            Write-Host "::warning::this runner's screen could not be captured and read (exit code $($live.Code)): $($live.Result.error) The live path was NOT confirmed"
          }
      - name: Single instance test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sitest'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $first = Start-Process dist/7HillsLink.exe -ArgumentList '--autostart' -PassThru
          Start-Sleep 12
          $second = Start-Process dist/7HillsLink.exe -ArgumentList '--autostart' -PassThru
          $second | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          $log = Get-Content "$env:LOCALAPPDATA\7HillsLink\link.log" -ErrorAction SilentlyContinue
          $log
          $ok = $second.HasExited -and -not $first.HasExited
          Get-Process 7HillsLink -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Error 'second start did not exit while the first kept running'; exit 1 }
          if (-not ($log -match 'already running')) { Write-Error 'no already-running line in link.log'; exit 1 }
      - name: Update install test
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'swaptest'
          New-Item -ItemType Directory -Force $d, "$d\lad\7HillsLink\update" | Out-Null
          Copy-Item dist/7HillsLink.exe "$d\7HillsLink.exe"
          Copy-Item dist/7HillsLink.exe "$d\lad\7HillsLink\update\7HillsLink-9.9.9.exe"
          $dummy = Start-Process ping -ArgumentList '-n','3','127.0.0.1' -PassThru -WindowStyle Hidden
          $env:LOCALAPPDATA = "$d\lad"
          $p = Start-Process "$d\lad\7HillsLink\update\7HillsLink-9.9.9.exe" -ArgumentList '--install-to',"$d\7HillsLink.exe",'--wait',"$($dummy.Id)",'--from-version','0.0.1' -PassThru
          $p | Wait-Process -Timeout 90
          $log = "$d\lad\7HillsLink\update\update.log"
          Get-Content $log
          Get-Process 7HillsLink -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Select-String -Path $log -Pattern ' updated$' -Quiet)) { Write-Error 'install did not complete'; exit 1 }
          # The backup is checked in the log, not on disk: the new version removes 7HillsLink.old.exe as
          # soon as it runs, and now and then it got there before this step looked.
          if (-not (Select-String -Path $log -Pattern 'kept the old version as 7HillsLink\.old\.exe$' -Quiet)) { Write-Error 'no backup kept'; exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/7HillsLink.exe -Algorithm SHA256).Hash.ToLower()
          "$h  7HillsLink.exe" | Out-File -Encoding ascii -NoNewline dist/7HillsLink.exe.sha256
          Write-Host "sha256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: 7HillsLink
          path: dist/7HillsLink.exe
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/sevenhills_link/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
      # Every push to main publishes (or refreshes) the release for the version in __init__.py.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 7Hills Link ${{ steps.ver.outputs.tag }}
          body: |
            Windows SmartScreen asks once because the exe is not signed yet: More info → Run anyway.
            Download: https://github.com/TheBanjolorian/7hills-link/releases/latest/download/7HillsLink.exe
            Linux (Wine/Proton): run from source, see https://github.com/TheBanjolorian/7hills-link#linux-wine--proton
          files: |
            dist/7HillsLink.exe
            dist/7HillsLink.exe.sha256
          overwrite_files: true
          make_latest: true
